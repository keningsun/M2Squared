<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Liquidity Solutions - Bold stacked pools, hugging edges -->

  <!-- Wide base -->
  <rect x="24" y="280" width="352" height="72" rx="18" fill="#70B6E8" opacity="0.35"/>

  <!-- Three oversized pools rising -->
  <rect x="40" y="200" width="96" height="152" rx="20" fill="#70B6E8" opacity="0.55"/>
  <rect x="152" y="152" width="96" height="200" rx="20" fill="#70B6E8" opacity="0.7"/>
  <rect x="264" y="104" width="96" height="248" rx="20" fill="#70B6E8" opacity="0.9"/>

  <!-- Oversized upward arrows inside each pool -->
  <polygon points="88,304 72,328 104,328" fill="#70B6E8" opacity="0.9"/>
  <polygon points="200,256 184,280 216,280" fill="#70B6E8" opacity="0.9"/>
  <polygon points="312,208 296,232 328,232" fill="#70B6E8" opacity="0.9"/>
</svg>