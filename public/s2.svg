<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pay-in & Payouts - Bold double-headed flow, edge-to-edge -->

  <!-- Wide pill channel across canvas -->
  <rect x="32" y="140" width="336" height="120" rx="60" fill="#70B6E8" opacity="0.28"/>

  <!-- Massive opposing arrows -->
  <polygon points="32,200 96,140 96,260" fill="#70B6E8" opacity="0.6"/>
  <polygon points="368,200 304,140 304,260" fill="#70B6E8" opacity="0.6"/>

  <!-- Central hub (dominant) -->
  <circle cx="200" cy="200" r="80" fill="#70B6E8" opacity="0.9"/>
  <circle cx="200" cy="200" r="44" fill="#70B6E8" opacity="0.5"/>

  <!-- Large side nodes close to edges -->
  <rect x="32" y="64" width="112" height="72" rx="20" fill="#70B6E8" opacity="0.35"/>
  <rect x="256" y="264" width="112" height="72" rx="20" fill="#70B6E8" opacity="0.35"/>
</svg>