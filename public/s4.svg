  <circle cx="200" cy="200" r="172" stroke="#70B6E8" stroke-width="10" opacity="0.15"/>
  <circle cx="200" cy="200" r="136" stroke="#70B6E8" stroke-width="8" opacity="0.2"/>

  <!-- Central shield -->
  <path d="M 200 96 C 236 96, 264 124, 264 160 L 264 240 C 264 300, 200 328, 200 328 C 200 328, 136 300, 136 240 L 136 160 C 136 124, 164 96, 200 96 Z" fill="#70B6E8" opacity="0.9"/>
  <path d="M 200 124 C 220 124, 236 140, 236 164 L 236 224 C 236 260, 200 276, 200 276 C 200 276, 164 260, 164 224 L 164 164 C 164 140, 180 124, 200 124 Z" fill="#70B6E8" opacity="0.5"/>

  <!-- Checkmark -->
  <path d="M 176 204 L 192 220 L 224 184" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Perimeter nodes -->
  <circle cx="200" cy="48" r="18" fill="#70B6E8" opacity="0.6"/>
  <circle cx="336" cy="200" r="18" fill="#70B6E8" opacity="0.6"/>
  <circle cx="200" cy="352" r="18" fill="#70B6E8" opacity="0.6"/>
  <circle cx="64" cy="200" r="18" fill="#70B6E8" opacity="0.6"/>

  <!-- Cross lines -->
  <line x1="64" y1="200" x2="336" y2="200" stroke="#70B6E8" stroke-width="6" opacity="0.2"/>
  <line x1="200" y1="64" x2="200" y2="336" stroke="#70B6E8" stroke-width="6" opacity="0.2"/>
</svg>